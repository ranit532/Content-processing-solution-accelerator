version: '3.8'
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --silent --location /data"
    volumes:
      - ./azurite-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
