trigger:
  branches:
    include:
      - main

variables:
  ACR_LOGIN_SERVER: ''
  ACR_NAME: ''
  ACR_USERNAME: ''
  ACR_PASSWORD: ''
  RESOURCE_GROUP: ''
  LOCATION: 'eastus'
  IMAGE_BACKEND: 'my-backend:$(Build.BuildId)'
  IMAGE_FRONTEND: 'my-frontend:$(Build.BuildId)'
  AZURE_SERVICE_CONNECTION: '' # configure Azure DevOps service connection name

stages:
- stage: Test
  displayName: Test
  jobs:
  - job: UnitTests
    displayName: Run unit tests (pytest)
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'
      - script: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pytest -q
        displayName: Run pytest

  - job: E2ETests
    displayName: Run Playwright E2E tests
    dependsOn: UnitTests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'
      - task: NodeTool@0
        inputs:
          versionSpec: '18.x'
      - script: |
          # start Azurite for storage emulation
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 mcr.microsoft.com/azure-storage/azurite
          # install backend deps
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          # install frontend deps (includes Playwright)
          npm ci --prefix frontend
          # wait for Azurite
          sleep 3
          # start the backend harness (API + worker) in background
          nohup .venv/bin/python tests/local/worker_harness.py &
          # wait for backend to be healthy
          sleep 5
          # run Playwright tests (assumes Playwright configured in frontend dev deps)
          npx playwright test tests/e2e --project=chromium --timeout=30000
        displayName: Run E2E tests with Azurite and harness

- stage: Build
  displayName: Build and Push Images
  dependsOn: Test
  jobs:
  - job: BuildAndPush
    displayName: Build and Push to ACR
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self

      - script: |
          echo "Building backend image"
          docker build -t $(IMAGE_BACKEND) -f src/Dockerfile src
        displayName: Build backend image

      - script: |
          echo "Building frontend image"
          docker build -t $(IMAGE_FRONTEND) -f frontend/Dockerfile frontend
        displayName: Build frontend image

      - task: AzureCLI@2
        displayName: Login to ACR
        inputs:
          azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            az acr login --name $(ACR_NAME)

      - script: |
          docker tag $(IMAGE_BACKEND) $(ACR_LOGIN_SERVER)/$(IMAGE_BACKEND)
          docker tag $(IMAGE_FRONTEND) $(ACR_LOGIN_SERVER)/$(IMAGE_FRONTEND)
        displayName: Tag images

      - script: |
          echo "Pushing images to ACR"
          docker push $(ACR_LOGIN_SERVER)/$(IMAGE_BACKEND)
          docker push $(ACR_LOGIN_SERVER)/$(IMAGE_FRONTEND)
        displayName: Push images to ACR

- stage: Deploy
  displayName: Deploy infrastructure (Bicep) and apps
  dependsOn: Build
  jobs:
  - deployment: DeployBicep
    displayName: Deploy Bicep templates
    environment: '$(RESOURCE_GROUP)'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
            - task: AzureCLI@2
              displayName: 'Create resource group and deploy Bicep'
              inputs:
                azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  az group create -n $(RESOURCE_GROUP) -l $(LOCATION)
                  az deployment group create -g $(RESOURCE_GROUP) \
                    --template-file infra/bicep/main.bicep \
                    --parameters projectName=$(Build.Repository.Name) \
                      openaiApiKey=$(OPENAI_API_KEY) \
                      cosmosKey=$(COSMOS_KEY) \
                      location=$(LOCATION)
            - script: |
                python3 scripts/smoke_test.py --base-url https://$(ACR_LOGIN_SERVER) --api-key $(API_KEY)
              displayName: Run smoke tests
